# ── Model Configuration ──
models:
  provider: "omp-subscription"
  generation: "openai-codex/gpt-5.6-luna"
  thinking: "low"
  context_window_tokens: 272000
  timeout_s: 300

subscription:
  call_limit: 40


# ── Budget ──
budget:
  max_dollars: 410.0
  warn_at_dollars: 350.0

# ── Chunking ──
chunking:
  chunk_size: 512        # tokens (approx words)
  chunk_overlap: 64
  min_chunk_size: 50

# ── Retrieval ──
retrieval:
  mode: "bm25"
  bm25_top_k: 20
  rag_top_k: 10


# ── RLM Controller ──
rlm:
  max_depth: 1
  max_iterations: 12
  max_subcalls: 12
  history_chars: 12000
  stdout_chars: 3000


# ── Baselines ──
fullcontext:
  max_input_tokens: 260000



# ── Benchmarks ──
benchmarks:
  needle_haystack:
    haystack_lengths: [1000, 5000, 10000, 25000, 50000, 100000]
    needle_positions: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
    num_samples: 5
    distractor_count: 0
  needle_haystack_stress:
    haystack_lengths: [10000, 50000, 100000, 250000]
    needle_positions: [0.1, 0.5, 0.9]
    num_samples: 3
    distractor_count: 6
    distractor_repeat_factor: 1
    confusion_block_repeats: 0
  needle_haystack_challenging:
    haystack_lengths: [100000, 250000, 500000]
    needle_positions: [0.1, 0.5, 0.9]
    num_samples: 3
    distractor_count: 6
    distractor_repeat_factor: 4
    confusion_block_repeats: 6
  multihop:
    num_samples: 15
    hops: [2, 3]
    doc_lengths: [10000, 50000, 100000, 500000]
  longbench:
    datasets: ["qasper", "narrativeqa"]
    max_samples: 50
  musique:
    num_samples: 10
    hops: [2, 3, 4]
    doc_lengths: [10000, 50000, 100000]
    methods: ["rag", "rlm"]
  diagnostic:
    sniah_context_lengths: [32768, 131072, 384000]
    sniah_tasks_per_length: 10
    dense_record_counts: [500, 2000, 8000]
    dense_tasks_per_size: 10
    oolong_dataset: "oolongbench/oolong-synth"
    oolong_revision: "f0d59eaf0febf130664cfceb710436c8e3216b2b"
    max_samples: 50


# ── Experiment ──
experiment:
  seed: 42
  methods: ["fullcontext", "rag", "rlm_depth0", "rlm_depth1"]
  output_dir: "results"
